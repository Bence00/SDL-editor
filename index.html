<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SDL Editor (Modular)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="palette">
      <h2>SDL Palette</h2>
      <div class="palette-item" draggable="true" data-node-type="process">Process</div>
      <div class="palette-item" draggable="true" data-node-type="state">State</div>
      <div class="palette-item" draggable="true" data-node-type="decision">Decision</div>
      <div class="palette-item" draggable="true" data-node-type="signal">Signal</div>
    </aside>

    <main id="editor">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>
  </div>

  <!-- Entry point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
