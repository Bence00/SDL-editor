<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SDL Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="app">

    <!-- Sidebar / Palette -->
    <aside id="palette">

      <h2>SDL-88</h2>

      <!-- Grid toggle -->
      <div class="control-group">
        <label id="snapToggle">
          <input type="checkbox" id="snapToGridCheckbox" checked />
          Snap to grid
        </label>
      </div>

      <!-- Save / Load name + buttons (NO prompt) -->
      <div class="control-group">
        <label for="diagramNameInput" class="field-label">Diagram name</label>
        <input
          id="diagramNameInput"
          type="text"
          placeholder="diagram name"
          value="default"
        />
      </div>

      <div class="control-group">
        <button id="btnSave">💾 Save</button>
        <button id="btnLoad">📂 Load</button>
        <button id="btnClear">🧹 Clear</button>
      </div>

      <!-- Component List -->
      <div id="paletteItems">
          <div class="palette-item" draggable="true" data-node-type="start">🟢 Start</div>
          <div class="palette-item" draggable="true" data-node-type="state">🔷 State</div>
          <div class="palette-item" draggable="true" data-node-type="input">📥 Input</div>
          <div class="palette-item" draggable="true" data-node-type="output">📤 Output</div>
          <div class="palette-item" draggable="true" data-node-type="decision">🔀 Decision</div>
          <div class="palette-item" draggable="true" data-node-type="createTask">🧩 Task</div>
          <div class="palette-item" draggable="true" data-node-type="stop">🔴 Termination</div>
      </div>
       <div id="quickHelp" class="quick-help">
        <strong>Delete</strong>: X / Backspace / Delete<br>
        <strong>Node label</strong>: double-click the node<br>
        <strong>Decision branch label</strong> : double-click the edge<br>
        <strong>Undo/redo</strong> : Ctrl-Z, Ctrl-Y<br>
      </div>
    </aside>

    <!-- Main Editor Canvas -->
    <main id="editor">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>

  </div>

  <!-- Load panel overlay -->
  <div id="loadPanel" class="load-panel hidden">
    <div class="load-panel-inner">
      <div class="load-panel-header">
        <span>Saved diagrams</span>
        <button id="loadPanelClose" class="close-btn">✕</button>
      </div>
      <div id="loadList" class="load-list">
        <!-- filled dynamically -->
      </div>
    </div>
  </div>

  <!-- Entry point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
